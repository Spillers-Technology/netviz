name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Build web placeholder
        run: |
          npm ci --prefix web
          npm run --prefix web build
      - name: Build desktop frontend
        run: |
          npm ci --prefix desktop/frontend
          npm run --prefix desktop/frontend build

name: Release Builds

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-unix:
    name: Build release (${{ matrix.os }})
    runs-on: [self-hosted, "${{ matrix.os }}"]
    strategy:
      fail-fast: false
      matrix:
        os: [Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ inputs.tag }}"
          fi
          goos="$(go env GOOS)"
          goarch="$(go env GOARCH)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "goos=$goos" >> "$GITHUB_OUTPUT"
          echo "goarch=$goarch" >> "$GITHUB_OUTPUT"
          echo "asset=netviz-${tag}-${goos}-${goarch}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Build Go binaries
        shell: bash
        run: |
          mkdir -p dist/bin
          go build -o dist/bin/netviz-cli ./cmd/netviz-cli
          go build -o dist/bin/netviz-server ./cmd/netviz-server
          go build -o dist/bin/netviz-probe ./cmd/netviz-probe
      - name: Build desktop app
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          npm ci --prefix desktop/frontend
          npm run --prefix desktop/frontend build
          export PATH="$HOME/go/bin:$PATH"
          # Debian 13 and Ubuntu 24.04+ ship WebKitGTK 4.1 only; Wails links 4.0 by default.
          (cd desktop && wails build -tags webkit2_41)
      - name: Stage archive
        shell: bash
        run: |
          mkdir -p "dist/netviz/bin"
          cp -R dist/bin/. "dist/netviz/bin/"
          cp desktop/build/bin/netviz "dist/netviz/netviz"
          chmod +x "dist/netviz/netviz"
          cp README.md LICENSE CHANGELOG.md MILESTONES.md PROBE_DEPLOYMENT.md "dist/netviz/"
          tar -C dist -czf "${{ steps.meta.outputs.asset }}" netviz
          shasum -a 256 "${{ steps.meta.outputs.asset }}" > "${{ steps.meta.outputs.asset }}.sha256"
      - name: Upload release asset
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          ASSET_PATHS: |
            ${{ steps.meta.outputs.asset }}
            ${{ steps.meta.outputs.asset }}.sha256
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const assetPaths = process.env.ASSET_PATHS.split(/\r?\n/).map((item) => item.trim()).filter(Boolean);

            let release = context.payload.release;
            if (!release) {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = response.data;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
            });

            for (const assetPath of assetPaths) {
              const name = path.basename(assetPath);
              const existing = assets.find((asset) => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }

              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length,
                },
              });
            }

  build-windows:
    name: Build release (Windows)
    runs-on: [self-hosted, Windows]
    # The federated credential trusts exactly this repository's release
    # environment, so a published release (which runs as its tag) and a manual
    # run (which runs as the default branch) authenticate the same way. The
    # environment only accepts the default branch and v* tags.
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      RUNNER_TOOL_CACHE: C:\actions-toolcache
      AGENT_TOOLSDIRECTORY: C:\actions-toolcache
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tool cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:RUNNER_TOOL_CACHE | Out-Null
      # Fails before anything is built, and refuses to fall back to an unsigned
      # Windows release if signing is misconfigured.
      - name: Require signing configuration
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $missing = @('SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE',
                       'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Code signing is not configured; missing: $($missing -join ', '). Set them under Settings > Environments > release. Windows releases are never published unsigned. See RELEASING.md."
          }
          if (-not (Get-Command az -ErrorAction SilentlyContinue)) {
            throw 'The Azure CLI is not installed on this runner; azure/login needs it. See RELEASING.md > Runner Tooling.'
          }
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ inputs.tag }}"
          }
          $goos = go env GOOS
          $goarch = go env GOARCH
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "goos=$goos" >> $env:GITHUB_OUTPUT
          "goarch=$goarch" >> $env:GITHUB_OUTPUT
          "asset=netviz-$tag-$goos-$goarch.zip" >> $env:GITHUB_OUTPUT
      - name: Build Go binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/bin | Out-Null
          go build -o dist/bin/netviz-cli.exe ./cmd/netviz-cli
          go build -o dist/bin/netviz-server.exe ./cmd/netviz-server
          go build -o dist/bin/netviz-probe.exe ./cmd/netviz-probe
      - name: Build desktop app
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          npm ci --prefix desktop/frontend
          npm run --prefix desktop/frontend build
          $env:PATH = "$env:USERPROFILE\go\bin;$env:PATH"
          Push-Location desktop
          wails build
          Pop-Location
      # Signed before staging so the archive, and the SHA-256 the updater checks
      # against it, describe the signed binaries and not the unsigned ones.
      - name: Sign and verify binaries
        uses: ./.github/actions/sign-release
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          account: ${{ vars.SIGNING_ACCOUNT }}
          profile: ${{ vars.SIGNING_PROFILE }}
          expected-subject: ${{ vars.SIGNING_EXPECTED_SUBJECT }}
          files: |
            dist/bin/netviz-cli.exe
            dist/bin/netviz-server.exe
            dist/bin/netviz-probe.exe
            desktop/build/bin/netviz.exe
      - name: Stage archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/netviz/bin | Out-Null
          Copy-Item dist/bin/* dist/netviz/bin/ -Recurse -Force
          Copy-Item desktop/build/bin/netviz.exe dist/netviz/netviz.exe -Force
          Copy-Item README.md,LICENSE,CHANGELOG.md,MILESTONES.md,PROBE_DEPLOYMENT.md dist/netviz/ -Force
          Compress-Archive -Path dist/netviz/* -DestinationPath "${{ steps.meta.outputs.asset }}" -Force
          $hash = Get-FileHash "${{ steps.meta.outputs.asset }}" -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  ${{ steps.meta.outputs.asset }}" | Out-File "${{ steps.meta.outputs.asset }}.sha256" -Encoding ascii
      - name: Upload release asset
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          ASSET_PATHS: |
            ${{ steps.meta.outputs.asset }}
            ${{ steps.meta.outputs.asset }}.sha256
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const assetPaths = process.env.ASSET_PATHS.split(/\r?\n/).map((item) => item.trim()).filter(Boolean);

            let release = context.payload.release;
            if (!release) {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = response.data;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
            });

            for (const assetPath of assetPaths) {
              const name = path.basename(assetPath);
              const existing = assets.find((asset) => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }

              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length,
                },
              });
            }

services:
  netviz:
    image: netviz:local
    # Build for the host architecture.
    pull_policy: build
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Optional shared key for scanners enrolled before managed probes.
      NETVIZ_INGEST_KEY: ${NETVIZ_INGEST_KEY:-}
      # Optional read-only inventory key for AnchorDesk.
      NETVIZ_INVENTORY_KEY: ${NETVIZ_INVENTORY_KEY:-}
      # Optional OIDC SSO for the web UI; leave unset for trusted-LAN mode.
      NETVIZ_OIDC_ISSUER: ${NETVIZ_OIDC_ISSUER:-}
      NETVIZ_OIDC_CLIENT_ID: ${NETVIZ_OIDC_CLIENT_ID:-}
      NETVIZ_OIDC_CLIENT_SECRET: ${NETVIZ_OIDC_CLIENT_SECRET:-}
      NETVIZ_PUBLIC_URL: ${NETVIZ_PUBLIC_URL:-}
      NETVIZ_SESSION_SECRET: ${NETVIZ_SESSION_SECRET:-}
    volumes:
      - netviz-data:/data

volumes:
  netviz-data:
